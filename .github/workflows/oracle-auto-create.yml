name: Oracle Auto Create Script

on:
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Debug modunu etkinleştir?'
        required: false
        default: 'false'

jobs:
  run-oracle-script:
    runs-on: ubuntu-latest
    
    steps:
      - name: Repository'yi klonla
        uses: actions/checkout@v4
      
      - name: Python 3.11'i kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Gereksinimleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: PEM dosyasını geri yükle
        env:
          OCI_KEY_FILE_BASE64: ${{ secrets.OCI_KEY_FILE_BASE64 }}
        run: |
          mkdir -p ~/.oci
          echo "$OCI_KEY_FILE_BASE64" | base64 -d > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
      
      - name: SSH Public Key'i hazırla
        env:
          SSH_PRIVATE_KEY_BASE64: ${{ secrets.ORACLE_SSH_PRIVATE_KEY_BASE64 }}
        run: |
          # Private key'i decode et
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_BASE64" | base64 -d > ~/.ssh/oracle_vm
          chmod 600 ~/.ssh/oracle_vm
          
          # Public key'i derive et
          ssh-keygen -y -f ~/.ssh/oracle_vm > ~/.ssh/oracle_vm.pub
          
          # Public key'i environment variable'a kaydet
          echo "SSH_PUB=$(cat ~/.ssh/oracle_vm.pub)" >> $GITHUB_ENV
      
      - name: Oracle scripti çalıştır
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY_FILE: ~/.oci/oci_api_key.pem
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          SSH_PUBLIC_KEY: ${{ env.SSH_PUB }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          python oracle_auto_create.py
      
      - name: Log dosyasını yükle (artifact olarak)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stok_log
          path: stok_log.txt
          retention-days: 30
      
      - name: Workflow başarısız oldu (Notif)
        if: failure()
        run: |
          echo "❌ Oracle scripti başarısız oldu!"
          echo "Detaylar için artifacts bölümünde stok_log.txt dosyasını kontrol edin."
