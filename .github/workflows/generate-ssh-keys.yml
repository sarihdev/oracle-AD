name: SSH Anahtarları Oluştur

on:
  workflow_dispatch:
    inputs:
      key_name:
        description: 'Anahtar ismi (örn: oracle-vm)'
        required: false
        default: 'oracle-vm'
      save_to_secrets:
        description: 'Private keyi GitHub Secrets''a kaydet? (GH_PAT secret''i gerekir)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  generate-ssh-keys:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: SSH klasörü oluştur
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
      
      - name: SSH Key Pair oluştur (PEM formatı)
        run: |
          KEY_NAME="${{ github.event.inputs.key_name }}"
          # PEM formatında private key oluştur (RSA 4096-bit)
          ssh-keygen -t rsa -b 4096 \
            -f ~/.ssh/${KEY_NAME} \
            -N "" \
            -C "github-actions-${{ github.run_id }}" \
            -m pem
          
          # Dosyaları göster
          echo "✅ Private Key oluşturuldu:"
          ls -lh ~/.ssh/${KEY_NAME}
          echo ""
          echo "✅ Public Key oluşturuldu:"
          ls -lh ~/.ssh/${KEY_NAME}.pub
      
      - name: Public Key'i göster
        run: |
          KEY_NAME="${{ github.event.inputs.key_name }}"
          echo "📄 PUBLIC KEY (VM'ye ekleyeceksiniz):"
          echo "=================================================="
          cat ~/.ssh/${KEY_NAME}.pub
          echo "=================================================="
      
      - name: GitHub Secrets'a Private Key'i kaydet
        if: github.event.inputs.save_to_secrets == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          KEY_NAME: ${{ github.event.inputs.key_name }}
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::GH_PAT secret'i tanımlı değil. Varsayılan GITHUB_TOKEN Actions secret'i yazamaz;"
            echo "::error::'secrets: write' yetkisi olan bir fine-grained PAT'i GH_PAT olarak ekleyin."
            exit 1
          fi
          SECRET_NAME="ORACLE_SSH_PRIVATE_KEY_BASE64"
          base64 -w 0 ~/.ssh/${KEY_NAME} | gh secret set ${SECRET_NAME} \
            --repo "${{ github.repository }}"
          echo "Secret kaydedildi: ${SECRET_NAME}"

      - name: Public Key'i artifact olarak kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssh-public-key-${{ github.run_number }}
          path: ~/.ssh/${{ github.event.inputs.key_name }}.pub
          retention-days: 7

      - name: Özet
        run: |
          echo "SSH anahtar çifti oluşturuldu."
          echo "1. Public key'i SSH_PUBLIC_KEY secret'i olarak ekleyin (yukarıdaki loga basıldı)."
          echo "2. Private key SADECE GH_PAT verildiyse ORACLE_SSH_PRIVATE_KEY_BASE64 secret'ine yazıldı;"
          echo "   artifact olarak yüklenmez. Aksi halde bu koşudan private key'i alamazsınız,"
          echo "   anahtarı lokalde 'ssh-keygen' ile üretmeniz önerilir."
          echo "3. VM oluşturmak için oracle-bot.yml workflow'unu çalıştırın."
