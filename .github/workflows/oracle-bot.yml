name: Oracle OCI Auto Create

on:
  workflow_dispatch: # Manuel tetikleme için
    inputs:
      max_cycles:
        description: 'Tur limiti (0 = sınırsız). Test için 1 verebilirsiniz.'
        required: false
        default: '0'
  schedule:
    - cron: "0 */6 * * *" # Her 6 saatte bir otomatik başlar (Github action limiti 6 saat)

concurrency:
  group: oracle-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # 6 saat (360 dk) hard limitine takılmadan durması için

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Paketleri Yükle
        run: pip install -r requirements.txt

      - name: OCI Key Dosyasını Oluştur
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_FILE_BASE64 }}" | base64 -d > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Botu Çalıştır
        env:
          PYTHONUNBUFFERED: "1"
          MAX_CYCLES: ${{ inputs.max_cycles || '0' }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY_FILE: /home/runner/.oci/oci_api_key.pem
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ vars.OCI_REGION || 'eu-frankfurt-1' }}
          OCI_AVAILABILITY_DOMAINS: ${{ vars.OCI_AVAILABILITY_DOMAINS }}
          OCI_OCPUS: ${{ vars.OCI_OCPUS || '4' }}
          OCI_MEMORY_IN_GBS: ${{ vars.OCI_MEMORY_IN_GBS || '24' }}
          OCI_SHAPE_LADDER: ${{ vars.OCI_SHAPE_LADDER }}
          USE_CAPACITY_REPORT: ${{ vars.USE_CAPACITY_REPORT || 'true' }}
          BLIND_ATTEMPT_EVERY: ${{ vars.BLIND_ATTEMPT_EVERY || '5' }}
          CYCLE_SLEEP_SECONDS: ${{ vars.CYCLE_SLEEP_SECONDS || '60' }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: python oracle_auto_create.py

      - name: Logu Artifact Olarak Yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stok-log-${{ github.run_number }}
          path: stok_log.txt
          if-no-files-found: warn
          retention-days: 14
