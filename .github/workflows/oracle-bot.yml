name: Oracle OCI Auto Create

on:
  workflow_dispatch: # Manuel tetikleme için
  schedule:
    - cron: "0 */6 * * *" # Her 6 saatte bir otomatik başlar (Github action limiti 6 saat)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # 6 saat (360 dk) hard limitine takılmadan durması için

    steps:
      - name: Kodu İndir
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Paketleri Yükle
        run: pip install -r requirements.txt

      - name: OCI Key Dosyasını Oluştur
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_KEY_FILE_BASE64 }}" | base64 -d > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

      - name: Botu Çalıştır
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_KEY_FILE: /home/runner/.oci/oci_api_key.pem
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: python oracle_auto_create.py
